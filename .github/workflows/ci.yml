name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Build (.NET)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/SmartBusTicketing.slnx

      - name: Build backend (Release)
        run: dotnet build backend/SmartBusTicketing.slnx --configuration Release --no-restore

  frontend:
    name: Frontend Build & Lint (Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint check (oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Build frontend (tsc + vite)
        working-directory: frontend
        run: npm run build

  test:
    name: Automated Regression Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: smart_bus_ticketing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Seed Demo Database
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root smart_bus_ticketing < backend/database/demo/smart-bus-demo-data.sql

      - name: Start Backend in Background
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__Default: "Server=127.0.0.1;Port=3306;Database=smart_bus_ticketing;User=root;Password=;TreatTinyAsBoolean=true"
          Payments__Simulator__Enabled: "true"
          Jwt__Key: "dev-only-smart-bus-ticketing-signing-key-change-me"
          ASPNETCORE_URLS: "http://0.0.0.0:5180"
        run: |
          dotnet run --project backend/SmartBusTicketing.Api/SmartBusTicketing.Api.csproj --configuration Release --no-launch-profile &
          echo "Started backend process in background"

      - name: Wait for Backend Health Check
        run: |
          for i in {1..30}; do
            if curl -s http://127.0.0.1:5180/api/health | grep -qi "Healthy"; then
              echo "Backend is ready and healthy!"
              exit 0
            fi
            echo "Waiting for backend ($i/30)..."
            sleep 1
          done
          echo "Backend failed to respond healthy within 30 seconds."
          exit 1

      - name: Run Seat Lock Tests (Concurrency & Seat Release)
        env:
          CONFIRM_TEST_DB: "1"
          API_URL: "http://127.0.0.1:5180"
          MYSQL_HOST: "127.0.0.1"
          MYSQL_PORT: "3306"
          MYSQL_USER: "root"
          MYSQL_PASSWORD: ""
          MYSQL_DB: "smart_bus_ticketing"
        run: node tests/regression/seat-lock.mjs

      - name: Run Refund Flow Tests (Cancellation & Refunds)
        env:
          CONFIRM_TEST_DB: "1"
          API_URL: "http://127.0.0.1:5180"
          MYSQL_HOST: "127.0.0.1"
          MYSQL_PORT: "3306"
          MYSQL_USER: "root"
          MYSQL_PASSWORD: ""
          MYSQL_DB: "smart_bus_ticketing"
        run: node tests/regression/refund-flow.mjs

  ci:
    name: ci / build-and-test
    runs-on: ubuntu-latest
    needs: [backend, frontend, test]
    if: always()
    steps:
      - name: Check Overall Status
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::One or more required CI jobs failed (Backend: ${{ needs.backend.result }}, Frontend: ${{ needs.frontend.result }}, Test: ${{ needs.test.result }})."
            exit 1
          fi
          echo "All checks passed successfully! Ready for merge."
