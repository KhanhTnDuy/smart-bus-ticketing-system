# CI: build backend, frontend và chạy bộ kiểm thử hồi quy một lệnh (npm test) trên MySQL thật.
# Đỏ ở bất kỳ bước nào thì PR/commit đó không được coi là "xanh".
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend build (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build backend/SmartBusTicketing.slnx --nologo

  frontend:
    name: Frontend build (tsc + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  test:
    name: Regression tests (npm test)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # run-all.mjs nạp dữ liệu demo, dựng backend với đúng cấu hình từng nhóm kiểm rồi chạy mọi kịch bản.
      - name: Chạy bộ kiểm thử
        env:
          CONFIRM_TEST_DB: '1'
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          ConnectionStrings__Default: Server=127.0.0.1;Port=3306;Database=smart_bus_ticketing;User=root;Password=;TreatTinyAsBoolean=true
        run: npm run test:reset-demo
      - name: Nhật ký kiểm thử
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/results/
          if-no-files-found: ignore
